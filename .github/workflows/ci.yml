name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (versões travadas)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --project tests/Mirante.Core.Tests --no-build -c Release

      - name: Pacotes vulneráveis
        shell: pwsh
        run: |
          $report = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match '(?im)^\s*>') { throw 'Pacotes com vulnerabilidades conhecidas.' }
